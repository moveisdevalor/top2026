<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Banner — Votação TOP 20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 500px; height: 500px; overflow: hidden; }
  body {
    font-family: 'Inter', sans-serif;
    width: 500px;
    height: 500px;
    position: relative;
    background:
      radial-gradient(120% 90% at 50% -10%, #5fded4 0%, rgba(45,180,175,0.55) 40%, rgba(45,180,175,0) 65%),
      linear-gradient(160deg, #2ab3ad 0%, #14807f 45%, #063f45 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
  }
  .logo { width: 300px; margin-bottom: 18px; }
  .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.65);
    margin-bottom: 10px;
  }
  h1 {
    font-size: 34px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
  }
  h1 span { color: #7fdcd4; }
  p {
    font-size: 14px;
    color: rgba(255,255,255,0.8);
    max-width: 320px;
    line-height: 1.5;
    margin-bottom: 26px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    color: #14807f;
    font-size: 15px;
    font-weight: 700;
    padding: 13px 28px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <img class="logo" src="/logo2026-crop.png" alt="TOP 20 2026" />
  <p class="label">PRÊMIO MÓVEIS DE VALOR</p>
  <h1>Vote agora nas<br /><span>marcas TOP 20</span></h1>
  <p>Ser lembrado é bom. Ser escolhido é TOP. Participe e ajude a valorizar quem faz o setor moveleiro.</p>
  <span class="cta">
    moveisdevalor.com.br
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M13 5l7 7-7 7" />
    </svg>
  </span>
</body>
</html>
